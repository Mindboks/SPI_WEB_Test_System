{% extends "layout.html" %}
{% block title %}パスワード再設定{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card shadow p-4">
            <h3 class="text-center mb-4">パスワード再設定</h3>
            
            <form method="POST" id="resetForm">
                <div class="mb-3">
                    <label>登録ID</label>
                    <input type="text" name="id" id="userId" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label>新しいパスワード</label>
                    <input type="password" name="password" id="password" class="form-control" required>
                    <div class="form-text text-muted small mt-1">
                        ※パスワードは「urawa + 生年月日8桁」です（例: urawa20000101）
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">再設定を申請</button>
            </form>
            
            <div class="text-center mt-3">
                <a href="{{ url_for('login') }}" class="text-decoration-none small">ログイン画面に戻る</a>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('resetForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const userId = document.getElementById('userId').value.trim();
        const password = document.getElementById('password').value.trim();
        
        if (!userId || !password) {
            alert('IDとパスワードを入力してください。');
            return;
        }
        
        // パスワード再設定リクエスト
        fetch('/password_reset', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: new URLSearchParams({
                'id': userId,
                'password': password
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message || 'パスワードが再設定されました。ログインしてください。');
                window.location.href = '/login';
            } else {
                // IDが見つからない場合のメッセージ
                if (data.not_found) {
                    if (confirm('入力されたIDは登録されていません。新規登録ページへ移動しますか？')) {
                        window.location.href = '/register';
                    }
                } else {
                    alert(data.message || 'エラーが発生しました。');
                }
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('通信エラーが発生しました。もう一度お試しください。');
        });
    });
</script>
{% endblock %}
