<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CBT System - 試験結果分析ダッシュボード</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&family=Urbanist:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
    * { box-sizing: border-box; }
    body {
        background-color: #0b0f19;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: 'Noto Sans JP', sans-serif;
        color: #f8fafc;
    }
    .slide-container {
        width: 100vw;
        height: 100vh;
        max-width: 1440px;
        max-height: 820px;
        padding: 3vh 3vw;
        display: flex;
        flex-direction: column;
        position: relative;
    }
    .header-area {
        display: flex;
        justify-content: space-between;
        align-items: flex-end;
        border-bottom: 2px solid #10b981;
        padding-bottom: 1.5vh;
        margin-bottom: 2.5vh;
        flex-shrink: 0;
    }
    .title-group p {
        color: #10b981;
        font-family: 'Urbanist', sans-serif;
        font-weight: 600;
        letter-spacing: 2px;
        margin: 0;
        font-size: 0.85rem;
        text-transform: uppercase;
    }
    .title-group h1 {
        font-size: 2rem;
        margin: 0;
        font-weight: 700;
    }
    .total-score-badge {
        text-align: right;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        padding: 0.8vh 2.5vw;
        border-radius: 12px;
        border: 1px solid #10b981;
        box-shadow: 0 4px 15px rgba(16, 185, 129, 0.2);
    }
    .score-val {
        font-size: 2.5rem;
        font-family: 'Urbanist', sans-serif;
        font-weight: 700;
        color: #10b981;
        line-height: 1;
    }
    .main-content {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 3vw;
        flex-grow: 1;
        min-height: 0;
    }
    .left-panel {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 2.5vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }
    .chart-wrapper {
        width: 100%;
        height: 90%;
        position: relative;
    }
    .right-panel {
        display: flex;
        flex-direction: column;
        gap: 2.5vh;
        min-height: 0;
    }
    .info-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 20px;
        border: 1px solid rgba(255, 255, 255, 0.08);
        padding: 2.5vh;
        flex: 1;
        display: flex;
        flex-direction: column;
        min-height: 0;
    }
    .card-title-label {
        color: #10b981;
        font-size: 1rem;
        font-weight: 700;
        margin-bottom: 1.5vh;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
    }
    .table-area {
        overflow-y: auto;
        flex-grow: 1;
        max-height: 280px;
    }
    .table-custom {
        width: 100%;
        border-collapse: collapse;
    }
    .table-custom th {
        font-size: 0.75rem;
        color: #94a3b8;
        text-transform: uppercase;
        padding-bottom: 8px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .table-custom td {
        padding: 1vh 0;
        font-size: 1.05rem;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .cat-score {
        text-align: right;
        color: #10b981;
        font-weight: 700;
    }
    
    /* AIアドバイスボックス - スクロール対応 */
    .ai-comment-box {
        font-size: 1rem;
        line-height: 1.6;
        color: #cbd5e1;
        overflow-y: auto;
        overflow-x: hidden;
        flex-grow: 1;
        white-space: normal;
        word-wrap: break-word;
        word-break: break-word;
        padding-right: 10px;
        max-height: 380px;
    }
    
    /* カスタムスクロールバー */
    .ai-comment-box::-webkit-scrollbar {
        width: 8px;
    }
    .ai-comment-box::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
    }
    .ai-comment-box::-webkit-scrollbar-thumb {
        background: #10b981;
        border-radius: 4px;
    }
    .ai-comment-box::-webkit-scrollbar-thumb:hover {
        background: #059669;
    }
    
    /* 全体のスクロールバー */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
    
    .footer-bar {
        margin-top: 1.5vh;
        display: flex;
        justify-content: space-between;
        font-size: 0.75rem;
        color: #475569;
        flex-shrink: 0;
    }
    .back-btn {
        background-color: transparent;
        color: #94a3b8;
        border: 1px solid #334155;
        padding: 5px 15px;
        border-radius: 8px;
        font-size: 0.85rem;
        transition: all 0.2s ease;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        gap: 5px;
    }
    .back-btn:hover {
        color: #fff;
        background-color: #1e293b;
        border-color: #475569;
    }
    
@media (max-width: 768px) {
    body {
        overflow-y: auto;
        min-height: auto;
        padding: 15px;
    }
    .slide-container {
        height: auto;
        padding: 2vh 3vw;
    }
    .main-content {
        grid-template-columns: 1fr;
        gap: 20px;
    }
    /* チャート：適度な高さで見やすく */
    .left-panel {
        height: 280px;
        min-height: 280px;
        padding: 20px 15px;
    }
    /* カードの余白を適切に */
    .info-card {
        flex: none;
        height: auto;
        min-height: 280px;
        padding: 20px 15px;
    }
    /* ヘッダー：縦並びで見やすい */
    .header-area {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
        margin-bottom: 20px;
    }
    /* スコアバッジ：左揃えで自然に */
    .total-score-badge {
        text-align: left;
        width: auto;
        padding: 10px 20px;
    }
    .score-val {
        font-size: 2rem;
    }
    /* タイトル：スマホサイズに調整 */
    .title-group h1 {
        font-size: 1.3rem;
    }
    .title-group p {
        font-size: 0.7rem;
    }
    /* AIコメント：スクロールしやすい高さ */
    .ai-comment-box {
        max-height: 350px;
        font-size: 0.9rem;
        line-height: 1.6;
        -webkit-overflow-scrolling: touch;
    }
    /* カテゴリーテーブル：見やすく */
    .table-area {
        max-height: 220px;
    }
    .table-custom td {
        font-size: 0.9rem;
        padding: 8px 0;
    }
    .card-title-label {
        font-size: 0.9rem;
        margin-bottom: 12px;
    }
    /* フッター：スマホで見やすく */
    .footer-bar {
        flex-direction: column;
        gap: 10px;
        text-align: center;
        margin-top: 20px;
    }
    .back-btn {
        display: inline-block;
        padding: 8px 16px;
        font-size: 0.9rem;
    }
}
    
    .skeleton-loader {
        background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
        background-size: 200% 100%;
        animation: loading 1.5s infinite;
        border-radius: 8px;
        height: 120px;
    }
    @keyframes loading {
        0% { background-position: 200% 0; }
        100% { background-position: -200% 0; }
    }
</style>
</head>
<body>

<div class="slide-container">
    <header class="header-area">
        <div class="title-group">
            <p>Individual Performance Analysis</p>
            <h1>{{ res.student_name }} 様 <span class="fw-normal text-secondary" style="font-size: 1.5rem;">| 診断結果レポート</span></h1>
        </div>
        <div class="total-score-badge">
            <div class="score-val">{{ res.score }} <span style="font-size: 1rem; color: #94a3b8;">点</span></div>
        </div>
    </header>

    <div class="main-content">
        
        <div class="left-panel shadow-sm">
            <div class="card-title-label"><i class="fa-solid fa-chart-radar text-success"></i> 能力値バランスマップ</div>
            <div class="chart-wrapper">
                <canvas id="radarChart"></canvas>
            </div>
        </div>

        <div class="right-panel">
            <div class="info-card shadow-sm">
                <div class="card-title-label"><i class="fa-solid fa-table-list"></i> カテゴリー別到達度</div>
                <div class="table-area">
                    <table class="table-custom">
                        <thead>
                            <tr>
                                <th>分析カテゴリー</th>
                                <th style="text-align: right;">正解率</th>
                            </tr>
                        </thead>
                        <tbody id="category-table-body">
                            <!-- 動的に挿入 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- AIコメント表示エリア（非同期読み込み） -->
            <div class="info-card shadow-sm" style="min-height: 0; display: flex; flex-direction: column;">
                <div class="card-title-label">
                    <i class="fa-solid fa-robot text-success"></i> AIパーソナライズ・アドバイス
                </div>
                <div id="ai-comment-area" style="flex: 1; min-height: 0; display: flex; flex-direction: column;">
                    <!-- ローディング中 -->
                    <div id="comment-loading" class="text-center py-4">
                        <div class="spinner-border text-success mb-2" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="text-muted mb-0">AIがコメントを生成中です...</p>
                        <p class="small text-muted">しばらくお待ちください</p>
                    </div>
                    <!-- コメント本体（後から表示）- スクロール対応 -->
                    <div id="comment-body" class="ai-comment-box" style="display: none; overflow-y: auto; max-height: 400px;">
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="chart-data" 
         data-labels='{{ details.labels | tojson | safe }}' 
         data-scores='{{ details.scores | tojson | safe }}' 
         style="display:none;"></div>
    
    <footer class="footer-bar">
        <div>
            <a href="{{ url_for('student_dashboard') }}" class="back-btn"><i class="fa-solid fa-arrow-left"></i> ダッシュボードに戻る</a>
        </div>
        <div class="text-end pt-2">
            受験ID: #{{ res.id }} &nbsp;|&nbsp; 実施日時: 
            <span id="jst-time">{{ res.timestamp }}</span>
            &nbsp;|&nbsp; CBT System
        </div>
    </footer>

</div>

<script>
    (function() {
        console.log('【デバッグ】result_page.html 読み込み開始');
        
        // ========== 1. レーダーチャート描画 ==========
        const canvas = document.getElementById('radarChart');
        const dataElement = document.getElementById('chart-data');
        
        if (!canvas) {
            console.error('【デバッグ】radarChart要素が見つかりません');
            return;
        }
        
        if (!dataElement) {
            console.error('【デバッグ】chart-data要素が見つかりません');
            return;
        }
        
        let labels = [];
        let scores = [];
        
        try {
            const labelsAttr = dataElement.getAttribute('data-labels');
            const scoresAttr = dataElement.getAttribute('data-scores');
            
            console.log('【デバッグ】data-labels:', labelsAttr);
            console.log('【デバッグ】data-scores:', scoresAttr);
            
            labels = JSON.parse(labelsAttr || '[]');
            scores = JSON.parse(scoresAttr || '[]');
            
            console.log('【デバッグ】パース後 labels:', labels);
            console.log('【デバッグ】パース後 scores:', scores);
            console.log('【デバッグ】カテゴリー数:', labels.length);
            
        } catch(e) {
            console.error('【デバッグ】データ解析エラー:', e);
            labels = ['データがありません'];
            scores = [0];
        }
        
        // カテゴリーテーブルを動的に生成
        const tableBody = document.getElementById('category-table-body');
        if (tableBody && labels.length > 0 && labels[0] !== 'データがありません') {
            tableBody.innerHTML = '';
            for (let i = 0; i < labels.length; i++) {
                const row = tableBody.insertRow();
                row.insertCell(0).innerHTML = `<td class="fw-bold">${labels[i]}</td>`;
                row.insertCell(1).innerHTML = `<td class="cat-score">${scores[i]}%</td>`;
            }
        } else if (tableBody) {
            tableBody.innerHTML = '<tr><td colspan="2" class="text-center text-muted">データがありません</td></tr>';
        }
        
        // チャート描画（データがある場合のみ）
        const ctx = canvas.getContext('2d');
        
        if (labels.length > 0 && labels[0] !== 'データがありません') {
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '正解率 (%)',
                        data: scores,
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        borderColor: '#10b981',
                        borderWidth: 3,
                        pointBackgroundColor: '#ffffff',
                        pointBorderColor: '#10b981',
                        pointRadius: 5,
                        pointHoverRadius: 7,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    return `${context.label}: ${context.raw}%`;
                                }
                            }
                        }
                    },
                    scales: {
                        r: {
                            beginAtZero: true,
                            max: 100,
                            ticks: {
                                stepSize: 20,
                                backdropColor: 'transparent'
                            },
                            grid: {
                                color: 'rgba(255,255,255,0.15)'
                            },
                            angleLines: {
                                color: 'rgba(255,255,255,0.15)'
                            },
                            pointLabels: {
                                color: '#f8fafc',
                                font: {
                                    size: 12,
                                    weight: 'bold',
                                    family: 'Noto Sans JP'
                                }
                            }
                        }
                    }
                }
            });
            console.log('【デバッグ】レーダーチャート描画完了');
        } else {
            console.log('【デバッグ】データがないためチャートを描画しません');
            // ダミーデータで表示
            new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: ['データなし'],
                    datasets: [{
                        data: [0],
                        backgroundColor: 'rgba(16, 185, 129, 0.15)',
                        borderColor: '#10b981',
                        borderWidth: 3,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } }
                }
            });
        }
        
        // ========== 2. 非同期AIコメント取得 ==========
        const resultId = "{{ result_id }}";
        const commentLoading = document.getElementById('comment-loading');
        const commentBody = document.getElementById('comment-body');
        
        console.log('【デバッグ】resultId:', resultId);
        
        if (resultId && commentLoading && commentBody) {
            fetch(`/api/result/${resultId}/ai_comment`, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include'
            })
            .then(res => {
                console.log('【デバッグ】AIコメントレスポンスステータス:', res.status);
                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }
                return res.json();
            })
            .then(data => {
                console.log('【デバッグ】AIコメントデータ:', data);
                commentLoading.style.display = 'none';
                if (data.comment) {
                    commentBody.innerText = data.comment;
                } else if (data.error) {
                    commentBody.innerText = 'コメントを取得できませんでした。\n' + data.error;
                } else {
                    commentBody.innerText = 'コメントを取得できませんでした。';
                }
                commentBody.style.display = 'block';
            })
            .catch(error => {
                console.error('【デバッグ】AIコメント取得エラー:', error);
                commentLoading.style.display = 'none';
                commentBody.innerText = 'コメントの取得中にエラーが発生しました。\nページを再読み込みしても改善しない場合は、管理者にお問い合わせください。';
                commentBody.style.display = 'block';
            });
        }
        // 3. フッターの時間を日本時間に変換
        (function() {
            const jstElement = document.getElementById('jst-time');
            if (jstElement) {
                const utcStr = jstElement.textContent.trim();
                console.log('【デバッグ】フッター時間変換前:', utcStr);
                
                if (utcStr) {
                    try {
                        // UTC文字列をパース
                        let dateStr = utcStr.replace(' ', 'T');
                        if (!dateStr.includes('Z') && !dateStr.includes('+')) {
                            dateStr += 'Z';
                        }
                        const utcDate = new Date(dateStr);
                        
                        // 日本時間に変換（+9時間）
                        const jstDate = new Date(utcDate.getTime() + 9 * 60 * 60 * 1000);
                        
                        // フォーマット
                        const pad = (n) => String(n).padStart(2, '0');
                        const y = jstDate.getFullYear();
                        const m = pad(jstDate.getMonth() + 1);
                        const d = pad(jstDate.getDate());
                        const h = pad(jstDate.getHours());
                        const min = pad(jstDate.getMinutes());
                        const s = pad(jstDate.getSeconds());
                        
                        const jstStr = `${y}-${m}-${d} ${h}:${min}:${s}`;
                        jstElement.textContent = jstStr;
                        console.log('【デバッグ】フッター時間変換後:', jstStr);
                    } catch(e) {
                        console.log('【デバッグ】フッター時間変換エラー:', e);
                    }
                }
            }
        })();
        // ========== ★★★ ここまで追加 ★★★ ==========



        console.log('【デバッグ】result_page.html 読み込み完了');
    })();
</script>
</body>
</html>
