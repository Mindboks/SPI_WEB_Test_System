<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | 学校専用SPI（選択）テストシステム</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .main-content {
            flex: 1;
        }
        
        .navbar {
            margin-bottom: 0 !important;
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            flex-shrink: 0;
        }
        
        /* フッター - シンプルに最下部固定 */
        .footer {
            flex-shrink: 0;
            background-color: #fff;
            border-top: 1px solid #dee2e6;
            padding: 0.5rem 0;
            font-size: 0.75rem;
            color: #adb5bd;
        }
        
        @media (max-width: 768px) {
            .footer {
                font-size: 0.65rem;
                padding: 0.35rem 0;
            }
        }
    </style>
</head>
<body>
    <!-- ヘッダー -->
    <nav class="navbar navbar-dark shadow-sm" style="background-color: #fff; border-bottom: 2px solid #0d6efd;">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}" style="font-size: 1.5rem; color: #0d6efd;">
                <i class="bi bi-book-half" style="margin-right: 15px; font-size: 1.5rem;"></i>
                学校専用SPI選択テストシステム
            </a>
            
            {% if session.get('user_id') %}
            <div class="text-dark d-flex align-items-center">
                <span class="me-3 bg-light px-3 py-1 rounded-pill small border">
                    <i class="bi bi-person-badge me-1"></i>{{ session.get('user_name') }}（{{ session.get('class_id') }}）
                </span>
            </div>
            {% endif %}
        </div>
    </nav>

    <!-- メインコンテンツ -->
    <div class="container mt-4 main-content">
        {% block content %}{% endblock %}
    </div>

    <!-- フッター -->
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">
                <i class="bi bi-c-circle"></i> 2026 学校専用SPI選択テストシステム
                <span class="mx-2">|</span>
                Built with <i class="bi bi-balloon-heart-fill" style="color: #cccccc;"></i> by <strong>Ikeda</strong>
                <span class="mx-2">|</span>
                ver.2.9.5&ensp;final-renovation.Version0.3.4
            </p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
