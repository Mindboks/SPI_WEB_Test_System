<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% endblock %} | 浦和専門学校</title>
    <!-- ファビコン設定 -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link rel="icon" type="image/png" sizes="16x16" href="{{ url_for('static', filename='favicon-16x16.png') }}">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='favicon-32x32.png') }}">
    <link rel="apple-touch-icon" sizes="180x180" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
    <link rel="manifest" href="{{ url_for('static', filename='site.webmanifest') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link href="{{ url_for('static', filename='css/bootstrap.min.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/bootstrap-icons.css') }}" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
    <style>
        .navbar { margin-bottom: 0 !important; padding-top: 0.5rem; padding-bottom: 0.5rem; }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{{ url_for('index') }}" style="font-size: 1.5rem; color: #0d6efd;">
                <i class="bi bi-mortarboard-fill" style="margin-right: 10px; font-size: 2rem;"></i>
                <i class="bi bi-book-half" style="margin-right: 15px; font-size: 1.5rem;"></i>
                浦和専門学校 システム
            </a>
            
            {% if session.get('user_id') %}
            <div class="text-dark d-flex align-items-center">
                <span class="me-3 bg-light px-3 py-1 rounded-pill small border">
                    <i class="bi bi-person-badge me-1"></i>{{ session.get('user_name') }}（{{ session.get('class_id') }}）
                </span>
            </div>
            {% endif %}
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>
    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
